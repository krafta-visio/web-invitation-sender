<!doctype html>
<html lang="id">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
	<meta http-equiv="Pragma" content="no-cache">
	<meta http-equiv="Expires" content="0">
	<link rel="icon" href="favicon.ico" type="image/x-icon">
	<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

	<title>Krafta - Web Invitation Sender</title>

	<!-- Tailwind CSS -->
	<script src="https://cdn.tailwindcss.com"></script>
	<link href="style.css" rel="stylesheet" crossorigin="anonymous">
</head>

<body class="bg-gray-50 min-h-screen text-gray-800 font-sans antialiased flex flex-col md:py-10">

	<div class="w-full max-w-2xl mx-auto bg-white md:rounded-2xl md:shadow-lg p-5 md:p-8 flex-grow md:flex-grow-0">

		<div class="flex items-center justify-between border-b border-gray-100 pb-5 mb-6">
			<div>
				<h1 class="text-xl md:text-2xl font-bold text-gray-800">Pengirim Undangan Web</h1>
				<p class="text-sm text-gray-500 mt-1">Sistem pengiriman link undangan</p>
			</div>
			<span
				class="bg-yellow-100 text-yellow-800 text-xs font-bold px-3 py-1 rounded-full border border-yellow-200">by.
				krafta</span>
		</div>

		<div class="space-y-6">
			<!-- Link Folder Undangan -->
			<div>
				<label for="direktoriUndangan" class="block mb-2 text-sm font-semibold text-gray-700">Link / Folder
					Undangan</label>
				<input type="text" id="direktoriUndangan"
					class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-3 transition-colors"
					placeholder="contoh: romeo-juliet">
				<p class="mt-2 text-xs text-gray-500">Nama folder undangan klien di server (huruf kecil & tanpa spasi).
				</p>
			</div>

			<hr class="border-gray-100">

			<!-- Nama Tamu -->
			<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
				<div>
					<label for="namaPenerima" class="block mb-2 text-sm font-semibold text-gray-700">Nama Tamu
						Undangan</label>
					<input type="text" id="namaPenerima"
						class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-3 transition-colors"
						placeholder="Contoh: Bpk. Budi Santoso">
					<p class="mt-2 text-xs text-gray-500">Nama tamu yang akan dicantumkan di dalam undangan.</p>
				</div>

				<!-- Nomor WhatsApp -->
				<div>
					<label for="nomorWAPenerima" class="block mb-2 text-sm font-semibold text-gray-700">Nomor WhatsApp
						Tujuan</label>
					<input type="text" maxlength="17" id="nomorWAPenerima"
						class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-green-500 focus:border-green-500 block w-full p-3 transition-colors"
						placeholder="Contoh: 08123456789 (Opsional)">
					<p class="mt-2 text-xs text-gray-500">Isi jika ingin langsung mengirim pesan via aplikasi WhatsApp.
					</p>
				</div>
			</div>

			<hr class="border-gray-100">

			<!-- Action Buttons -->
			<div class="flex flex-col sm:flex-row gap-3 pt-2">
				<button id="btnKirimViaWhatsapp" type="button"
					class="flex-1 text-white bg-green-600 hover:bg-green-700 focus:ring-4 focus:ring-green-200 font-medium rounded-lg text-sm px-5 py-3.5 text-center transition-all shadow-sm flex justify-center items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
					<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
						<path
							d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z" />
					</svg>
					Kirim via WhatsApp
				</button>
				<button id="btnSalinPesanUndangan" type="button"
					class="flex-1 text-gray-700 bg-white border border-gray-300 focus:outline-none hover:bg-gray-50 focus:ring-4 focus:ring-gray-100 font-medium rounded-lg text-sm px-5 py-3.5 text-center transition-all shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
					Salin Link & Pesan Undangan
				</button>
			</div>

			<!-- Preview Konsep -->
			<div class="mt-8 bg-yellow-50 rounded-xl overflow-hidden border border-yellow-200">
				<div class="bg-yellow-100/50 px-4 py-3 border-b border-yellow-200 flex justify-between items-center">
					<h3 class="text-sm font-bold text-yellow-800">Preview Pesan Undangan</h3>
				</div>
				<div class="p-4">
					<div id="previewPesanUndangan" class="text-sm text-gray-700 leading-relaxed min-h-[100px]"></div>
				</div>
			</div>

			<!-- Edit Konsep Button -->
			<div class="pt-2">
				<button type="button" id="btnOpenModal"
					class="w-full text-yellow-900 bg-yellow-300 hover:bg-yellow-400 focus:ring-4 focus:ring-yellow-100 font-semibold rounded-lg text-sm px-5 py-3 text-center transition-colors shadow-sm">
					Edit Teks Pembuka & Penutup
				</button>
			</div>
		</div>
	</div>

	<!-- Modal Edit Konsep -->
	<div id="modalEditKonsep" tabindex="-1"
		class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-screen max-h-full bg-gray-900/60 backdrop-blur-sm transition-all duration-300 opacity-0">
		<div class="relative p-4 w-full max-w-2xl max-h-full transition-transform transform scale-95"
			id="modalEditKonsepContent">
			<div class="relative bg-white rounded-2xl shadow-2xl overflow-hidden">
				<div class="flex items-center justify-between p-5 border-b border-gray-100 bg-gray-50/50">
					<h3 class="text-lg font-bold text-gray-900">Edit Konsep Pesan</h3>
					<button type="button" id="btnCloseModal"
						class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center transition-colors">
						<svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
							viewBox="0 0 14 14">
							<path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
								d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
						</svg>
						<span class="sr-only">Tutup modal</span>
					</button>
				</div>
				<div class="p-5 space-y-5">
					<div>
						<label for="pesan1" class="block mb-2 text-sm font-semibold text-gray-700">Teks Pembuka (Sebelum
							Link)</label>
						<textarea id="pesan1" rows="5"
							class="block p-3 w-full text-sm text-gray-800 bg-cyan-50 rounded-lg border border-cyan-200 focus:ring-cyan-500 focus:border-cyan-500 leading-relaxed resize-y"></textarea>
					</div>
					<div>
						<label for="pesan2" class="block mb-2 text-sm font-semibold text-gray-700">Teks Penutup (Setelah
							Link)</label>
						<textarea id="pesan2" rows="5"
							class="block p-3 w-full text-sm text-gray-800 bg-cyan-50 rounded-lg border border-cyan-200 focus:ring-cyan-500 focus:border-cyan-500 leading-relaxed resize-y"></textarea>
					</div>
				</div>
				<div class="flex items-center gap-3 p-5 border-t border-gray-100 bg-gray-50/50">
					<button type="button" id="simpanKonsepPesan"
						class="flex-1 md:flex-none text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-200 font-medium rounded-lg text-sm px-6 py-2.5 text-center transition-colors shadow-sm">Simpan
						Perubahan</button>
					<button type="button" id="btnCancelModal"
						class="flex-1 md:flex-none py-2.5 px-6 text-sm font-medium text-gray-700 focus:outline-none bg-white rounded-lg border border-gray-300 hover:bg-gray-50 hover:text-gray-900 focus:z-10 focus:ring-4 focus:ring-gray-100 transition-colors">Batal</button>
				</div>
			</div>
		</div>
	</div>

	<!-- Scripts -->
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"
		integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
	<script src="scripts.js"></script>
	<script>
		// Modal handling logic to replace Bootstrap's JS Modal
		$(document).ready(function () {
			function openModal() {
				const modal = $('#modalEditKonsep');
				const content = $('#modalEditKonsepContent');
				modal.removeClass('hidden').addClass('flex');
				// Small delay to allow display:flex to apply before animating opacity
				setTimeout(() => {
					modal.removeClass('opacity-0').addClass('opacity-100');
					content.removeClass('scale-95').addClass('scale-100');
				}, 10);
			}

			function closeModal() {
				const modal = $('#modalEditKonsep');
				const content = $('#modalEditKonsepContent');
				modal.removeClass('opacity-100').addClass('opacity-0');
				content.removeClass('scale-100').addClass('scale-95');
				// Wait for animation to finish before hiding
				setTimeout(() => {
					modal.addClass('hidden').removeClass('flex');
				}, 300);
			}

			$('#btnOpenModal').on('click', openModal);
			$('#btnCloseModal, #btnCancelModal').on('click', closeModal);

			// Close on backdrop click
			$('#modalEditKonsep').on('click', function (e) {
				if (e.target === this) {
					closeModal();
				}
			});

			// Intercept jQuery hide that scripts.js might call
			const originalHide = $.fn.modal;
			if (!originalHide) {
				$.fn.modal = function (action) {
					if (action === 'hide') {
						closeModal();
					}
				};
			}
		});
	</script>
</body>

</html>
